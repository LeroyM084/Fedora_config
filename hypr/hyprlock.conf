# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = ~/Images/wallpapers/wallhaven_2.png
  blur_passes = 0.5
}

# TIME
label {
  monitor =
  text = $TIME
  color = rgba(255, 255, 255, 1)
  font_size = 90
  font_family = JetBrainsMono Nerd Font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = rgba(255, 255, 255, 1)
  font_size = 25
  font_family = JetBrainsMono Nerd Font
  position = -30, -150
  halign = right
  valign = top
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 4
  outline_thickness = 0
  dots_size = 0
  dots_spacing = 0
  dots_center = true
  outer_color = rgba(255, 255, 255, 0.5)
  inner_color = rgba(255, 255, 255, 1)
  font_color = rgba(255, 255, 255, 0)
  fade_on_empty = true
  placeholder_text =
  hide_input = true
  check_color = rgba(255, 255, 255, 1)
  fail_color = rgba(255, 0, 0, 1)
  fail_text =
  capslock_color = rgba(255, 255, 255, 0)
  position = 0, 30
  halign = center
  valign = bottom
}