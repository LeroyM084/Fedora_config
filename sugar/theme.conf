[General]

# Remplace le nom du fichier par ton GIF de chat
Background="Backgrounds/cat.mp4"
DimBackgroundImage="0.1"
ScaleImageCropped="true"
ScreenWidth="1440"
ScreenHeight="900"

## [Blur Settings]

# On garde un flou partiel pour que le formulaire se détache du GIF sans le masquer totalement
FullBlur="false"
PartialBlur="true"
BlurRadius="60"

HaveFormBackground="true"
# Position à gauche comme l'original, ou "center" si tu veux que le chat soit bien visible
FormPosition="left"
BackgroundImageHAlignment="center"
BackgroundImageVAlignment="center"

# --- Palette de Couleurs Violette ---
# Texte principal en blanc cassé / lavande très clair
MainColor="#e2daeb"
# Violet électrique/néon pour les boutons et accents
AccentColor="#9d4edd"
# Fond du formulaire en violet très sombre et translucide
BackgroundColor="#1a1221"
OverrideLoginButtonTextColor="#ffffff"

InterfaceShadowSize="10"
InterfaceShadowOpacity="0.8"
# Des coins plus arrondis pour coller au style "soft" du chat
RoundCorners="25"
ScreenPadding="20" 
Font="Noto Sans"
FontSize=""

## [Interface Behavior]

ForceRightToLeft="false"
ForceLastUser="true"
ForcePasswordFocus="true"
ForceHideCompletePassword="false"
ForceHideVirtualKeyboardButton="true"
ForceHideSystemButtons="false"
AllowEmptyPassword="false"
AllowBadUsernames="false"

## [Locale Settings]

Locale=""
HourFormat="HH:mm"
DateFormat="dddd, d MMMM"

## [Translations]

# Personnalisation du message de bienvenue
# HeaderText="Miaou ! Bon retour."
TranslatePlaceholderUsername="Utilisateur"
TranslatePlaceholderPassword="Mot de passe"
TranslateLogin="Entrer"
TranslateLoginFailedWarning="Accès refusé"
TranslateSession="Session"